<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Book your office meal.">
    <title>Book Your Meal</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%B2%3C/text%3E%3C/svg%3E">
    <!-- (1) Intro: hide page until overlay is ready. Failsafe: reveal after 4s even if JS fails. -->
    <script>
      document.documentElement.classList.add('gy-pending');
      setTimeout(function(){document.documentElement.classList.remove('gy-pending','gy-playing')},4000);
    </script>
    <link rel="stylesheet" href="assets/gy-intro.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/styles.css?v=27">
  </head>
  <body>
    <main class="container">
      <header class="site-header">
        <div class="brand">
          <img src="assets/images/Meal_GY.png" alt="" class="title-icon">
          <h1>Book Your Meal</h1>
        </div>
        <button id="logout-button" class="button button-secondary" hidden>Logout</button>
      </header>

      <section id="login-view" class="card narrow">
        <div class="login-card-header">
          <img src="assets/images/goodyear-logo.png" alt="Goodyear" class="login-logo">
        </div>
        <div class="login-card-body">
          <h2>Sign in</h2>
          <p>Book your meals for the week.</p>
          <form id="login-form">
            <label for="email">Employee Email</label>
            <input id="email" type="email" autocomplete="email" required placeholder="you@goodyear.com">
            <button class="button login-btn" type="submit">Sign in</button>
            <p id="login-message" class="message" role="alert"></p>
          </form>
        </div>
      </section>

      <section id="employee-view" hidden>
        <div class="welcome-row">
          <div><h2 id="employee-name"></h2><p id="employee-email" class="muted"></p></div>
        </div>
        <section class="card">
          <h3>📅 Book a meal</h3>
          <div class="mode-switch" role="group" aria-label="Booking mode">
            <button class="button button-secondary active" data-mode="day" type="button">Daily</button>
            <button class="button button-secondary" data-mode="week" type="button">Weekly</button>
          </div>
          <div id="day-picker">
            <label for="meal-date">Select date</label>
            <input id="meal-date" type="date">
          </div>
          <div id="week-picker" hidden>
            <label for="week-start">Week starting</label>
            <input id="week-start" type="date">
            <p class="muted">Choose your meal preference for each workday, then save.</p>
            <div id="week-days" class="week-days"></div>
          </div>
          <div id="day-actions" class="actions">
            <button class="button" data-choice="booked" type="button">✅ Yes, book meal</button>
            <button class="button button-secondary" data-choice="declined" type="button">🚫 No meal</button>
            <button class="button button-text" data-choice="clear" type="button">Clear choice</button>
          </div>
          <div id="week-actions" class="actions" hidden>
            <button id="save-week" class="button" type="button">✅ Save week</button>
          </div>
          <p id="booking-message" class="message" role="status"></p>
        </section>
        <section class="card">
          <h3>🕒 Your upcoming bookings</h3>
          <div class="table-wrap"><table><thead><tr><th>Date</th><th>Meal</th></tr></thead><tbody id="upcoming-bookings"></tbody></table></div>
        </section>
      </section>

      <section id="admin-view" hidden>
        <div class="welcome-row"><div><h2>🧾 Admin meal report</h2><p id="admin-email" class="muted"></p></div></div>
        <section class="card">
          <div class="report-controls">
            <div><label for="report-start">From</label><input id="report-start" type="date"></div>
            <div><label for="report-end">To</label><input id="report-end" type="date"></div>
            <button id="load-report" class="button" type="button">Load report</button>
            <button id="download-report" class="button button-secondary" type="button">Download CSV</button>
          </div>
          <p id="report-total" class="total" aria-live="polite"></p>
          <div class="table-wrap"><table><thead id="report-head"><tr><th>Name</th><th>Email</th></tr></thead><tbody id="report-rows"></tbody></table></div>
          <p id="report-message" class="message" role="status"></p>
        </section>
      </section>
    </main>
    <script type="module" src="js/app.js?v=6"></script>
    <!-- (2) Intro script: last thing before </body> -->
    <script src="js/gy-intro.js" defer
            data-logo="assets/images/goodyear-logo.png"
            data-focus="#email"
            data-caption="Meal Booking"
            data-once="false"></script>
  </body>
</html>
